name: Validar aplicação e regras

on:
  push:
    branches:
      - main
      - 'prototype/**'
      - 'research/**'
      - 'spec/**'
      - 'implementation/**'
  pull_request:
    branches:
      - main
      - 'prototype/**'
      - 'research/**'
      - 'spec/**'
      - 'implementation/**'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes e sintaxe
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout v5.1.0

      - name: Preparar Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node v5.0.0
        with:
          node-version: 22

      - name: Executar testes das regras do fluxo
        run: node --test tests/workflow.test.js

      - name: Verificar sintaxe JavaScript
        run: |
          node --check prototipo/workflow.js
          node --check prototipo/app.js
